cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:ddk8osgyk}
  api-key: ${CLOUDINARY_API_KEY:848718324627338}
  api-secret: ${CLOUDINARY_API_SECRET:IlW5Xc70JZOIqM9gOdNo13JkpWM}
  secure: true

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bdreposteria?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    static-path-pattern: /**
  web:
    resources:
      static-locations: classpath:/static/,file:./static/,file:/app/static/

jwt:
  secret: ${JWT_SECRET:413F4428472B4B6250655368566D5970337336763979244226452948404D6351}

server:
  port: ${PORT:8080}
  address: 0.0.0.0
