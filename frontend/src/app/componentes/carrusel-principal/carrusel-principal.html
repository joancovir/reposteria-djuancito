<div class="promociones-hero-wrapper" id="carrusel" *ngIf="promociones && promociones.length > 0">
  <carousel [isAnimated]="true" [showIndicators]="promociones.length > 1" [interval]="5000">
    <slide *ngFor="let promo of promociones" class="promo-slide">
      <div class="slide-media-container">
        <img 
          [src]="promo.imagenUrl || 'assets/imagenes/promocion/oferta-general.png'" 
          [alt]="promo.titulo || 'Promoción Repostería D\'Juancito'" 
          class="slide-image"
          loading="eager"
        >
        <div class="slide-overlay"></div>
      </div>

      <div class="carousel-caption">
        <div class="caption-card">
          <div class="promo-badge" *ngIf="promo.descuento">
            <span class="badge-icon">🏷️</span>
            <span class="badge-text">¡{{ promo.descuento }}% DE DESCUENTO!</span>
          </div>

          <h2 class="promo-title">{{ promo.titulo }}</h2>

          <p class="promo-description" *ngIf="promo.descripcion">
            {{ promo.descripcion }}
          </p>

          <div class="promo-actions">
            <a [routerLink]="['/ofertas']" class="btn-promo-action">
              <span>Ver Más Ofertas</span>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" class="btn-icon">
                <path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8z"/>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </slide>
  </carousel>
</div>
