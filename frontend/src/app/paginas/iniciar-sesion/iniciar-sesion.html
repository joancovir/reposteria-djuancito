<div class="login-page">
  <div class="branding-column">
    <div class="branding-content">
      <a routerLink="/" class="logo-link">
        <img src="assets/imagenes/logo.png" alt="Logo de D.Juancito" class="logo-img">
        <h2>D.Juancito</h2>
      </a>
      <p class="slogan">"Donde el Sabor se Convierte en Recuerdo"</p>
    </div>
  </div>

  <div class="form-column">
    <div class="login-form">
      <h2>Iniciar Sesión</h2>
      <p class="text-muted mb-4">Ingresa tus credenciales para acceder a tu cuenta.</p>

      <!-- MENSAJE DE ERROR INLINE -->
      <div *ngIf="mensajeError" class="alert alert-danger d-flex align-items-center gap-2 mb-3 py-2 px-3 rounded-3" role="alert">
        <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
        <div>{{ mensajeError }}</div>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="needs-validation">
        
        <div class="form-group mb-3">
          <label for="email" class="form-label">Correo Electrónico</label>
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            formControlName="email" 
            placeholder="tu.correo@ejemplo.com"
            [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          <div class="invalid-feedback" *ngIf="loginForm.get('email')?.hasError('required')">
            El correo es obligatorio
          </div>
          <div class="invalid-feedback" *ngIf="loginForm.get('email')?.hasError('email')">
            Ingresa un correo válido
          </div>
        </div>

        <div class="form-group mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            formControlName="password" 
            placeholder="••••••••"
            [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <div class="invalid-feedback">
            La contraseña es obligatoria
          </div>
        </div>

        <div class="form-options mb-4">
          <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
        </div>
        
        <button 
          type="submit" 
          class="btn-submit w-100 d-flex justify-content-center align-items-center gap-2" 
          [disabled]="loginForm.invalid || cargando">
          <span *ngIf="cargando" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          <span *ngIf="cargando">Iniciando sesión...</span>
          <span *ngIf="!cargando && !loginForm.invalid">Ingresar</span>
          <span *ngIf="!cargando && loginForm.invalid">Completar campos</span>
        </button>

        <div class="register-link text-center mt-4">
          <span>¿No tienes una cuenta? </span>
          <a routerLink="/registrar" class="text-primary fw-bold">Regístrate aquí</a>
        </div>
      </form>
    </div>
  </div>
</div>
